          format: int32
          minimum: 0
    CartResponse:
      type: object
      required: [cartId, userId, items, lineCount, totalUnits, subtotal, createdAt, updatedAt]
      properties:
        cartId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemResponse'
        lineCount:
          type: integer
          format: int32
          minimum: 0
        totalUnits:
          type: integer
          format: int32
          minimum: 0
        subtotal:
          $ref: '#/components/schemas/NonNegativeMoney'
