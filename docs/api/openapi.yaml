          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
    FieldErrorResponse:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [timestamp, status, code, message, path, fieldErrors]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        code:
          type: string
          enum: [VALIDATION_ERROR, MALFORMED_REQUEST, RESOURCE_NOT_FOUND, DUPLICATE_RESOURCE, BUSINESS_RULE, INTEGRITY_VIOLATION, INTERNAL_ERROR]
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorResponse'
    PositiveMoney:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
      maximum: 9999999999.99
      multipleOf: 0.01
      example: 49.90
    NonNegativeMoney:
      type: number
      format: double
      minimum: 0
      maximum: 9999999999.99
      multipleOf: 0.01
      example: 5.00
    UserRole:
      type: string
      enum: [CUSTOMER, ADMIN]
    OrderStatus:
      type: string
      enum: [PENDING, CONFIRMED, PREPARING, SHIPPED, DELIVERED, CANCELLED]
    PaymentMethod:
      type: string
      enum: [CREDIT_CARD, BANK_TRANSFER, CASH_ON_DELIVERY]
    PaymentStatus:
      type: string
      enum: [PENDING, PAID, FAILED, REFUNDED]
