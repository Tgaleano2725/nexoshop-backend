        quantity:
          type: integer
          format: int32
          minimum: 1
        lineTotal:
          $ref: '#/components/schemas/NonNegativeMoney'
    OrderResponse:
      type: object
      required: [orderId, orderNumber, userId, status, paymentMethod, paymentStatus, recipientName, recipientPhone, shippingAddress, shippingCity, items, subtotal, shippingCost, total, createdAt, updatedAt]
