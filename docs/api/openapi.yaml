openapi: 3.0.3
info:
  title: NexoShop API
  version: 1.0.0
  description: >-
    Contrato estático de la API REST académica de NexoShop. Describe el backend
    monolítico implementado para usuarios, catálogo, carritos y pedidos. No
    incluye autenticación, JWT, autorización ni pagos externos.
servers:
  - url: http://localhost:8080
    description: Servidor local
tags:
  - name: Users
    description: Registro y consulta de usuarios.
  - name: Categories
    description: Gestión del catálogo de categorías.
  - name: Products
    description: Gestión de productos e inventario.
  - name: Carts
    description: Operaciones del carrito de un usuario.
  - name: Orders
    description: Checkout, consulta y transiciones de pedidos.
paths:
  /api/v1/users:
    post:
      tags: [Users]
      summary: Registrar usuario
      description: Crea un usuario CUSTOMER activo; la contraseña nunca se devuelve.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
            examples:
              default:
                $ref: '#/components/examples/RegisterUserRequestExample'
      responses:
        '201':
          description: Usuario creado.
          headers:
            Location:
              description: URI del usuario creado.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                default:
                  $ref: '#/components/examples/UserResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Consultar usuario
      description: Devuelve un usuario sin contraseña ni passwordHash.
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/categories:
    post:
      tags: [Categories]
      summary: Crear categoría
      description: Crea una categoría activa.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
            examples:
              default:
                $ref: '#/components/examples/CategoryRequestExample'
      responses:
        '201':
          description: Categoría creada.
          headers:
            Location:
              description: URI de la categoría creada.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Categories]
      summary: Listar categorías
      description: Devuelve categorías ordenadas por nombre e identificador. activeOnly es opcional y filtra únicamente categorías activas cuando vale true.
      operationId: listCategories
      parameters:
        - $ref: '#/components/parameters/ActiveOnly'
      responses:
        '200':
          description: Lista de categorías.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Categories]
      summary: Actualizar categoría
      description: Actualiza nombre y descripción de una categoría.
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Categoría actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Categories]
      summary: Consultar categoría
      description: Devuelve una categoría por identificador.
      operationId: getCategory
      responses:
        '200':
          description: Categoría encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/categories/{id}/activate:
    post:
      tags: [Categories]
      summary: Activar categoría
      description: Marca la categoría como activa.
      operationId: activateCategory
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Categoría activada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/categories/{id}/deactivate:
    post:
      tags: [Categories]
      summary: Desactivar categoría
      description: Marca la categoría como inactiva.
      operationId: deactivateCategory
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Categoría desactivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products:
    post:
      tags: [Products]
      summary: Crear producto
      description: Crea un producto dentro de una categoría activa.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            examples:
              default:
                $ref: '#/components/examples/ProductRequestExample'
      responses:
        '201':
          description: Producto creado.
          headers:
            Location:
              description: URI del producto creado.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Products]
      summary: Listar productos
      description: Devuelve una página estable de productos ordenada por id ascendente. activeOnly filtra productos activos y calcula la metadata sobre ese subconjunto.
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/ActiveOnly'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de productos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Products]
      summary: Actualizar producto
      description: Actualiza los datos del producto sin cambiar su stock.
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Producto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Products]
      summary: Consultar producto
      description: Devuelve un producto por identificador.
      operationId: getProduct
      responses:
        '200':
          description: Producto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/sku/{sku}:
    get:
      tags: [Products]
      summary: Consultar producto por SKU
      description: Normaliza el SKU y devuelve el producto coincidente.
      operationId: getProductBySku
      parameters:
        - $ref: '#/components/parameters/Sku'
      responses:
        '200':
          description: Producto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/activate:
    post:
      tags: [Products]
      summary: Activar producto
      description: Activa el producto si su categoría está activa.
      operationId: activateProduct
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Producto activado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/deactivate:
    post:
      tags: [Products]
      summary: Desactivar producto
      description: Desactiva el producto.
      operationId: deactivateProduct
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Producto desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/stock/increase:
    post:
      tags: [Products]
      summary: Incrementar stock
      description: Incrementa el stock con una cantidad positiva.
      operationId: increaseProductStock
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
            examples:
              default:
                $ref: '#/components/examples/StockAdjustmentExample'
      responses:
        '200':
          description: Stock incrementado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}/stock/decrease:
    post:
      tags: [Products]
      summary: Decrementar stock
      description: Reduce el stock sin permitir valores negativos.
      operationId: decreaseProductStock
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
            examples:
              default:
                $ref: '#/components/examples/StockAdjustmentExample'
      responses:
        '200':
          description: Stock decrementado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/cart:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Carts]
      summary: Obtener carrito
      description: Obtiene o crea el carrito del usuario activo.
      operationId: getCart
      responses:
        '200':
          description: Carrito del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRule'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Carts]
      summary: Vaciar carrito
      description: Elimina todas las líneas del carrito.
      operationId: clearCart
      responses:
        '200':
          description: Carrito vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/cart/items:
    post:
      tags: [Carts]
      summary: Agregar artículo al carrito
      description: Agrega o acumula un producto activo sin reservar stock.
      operationId: addCartItem
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
            examples:
              default:
                $ref: '#/components/examples/AddCartItemExample'
      responses:
        '200':
          description: Carrito actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/cart/items/{productId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [Carts]
      summary: Actualizar cantidad del carrito
      description: Establece una cantidad positiva que no puede superar el stock actual.
      operationId: updateCartItemQuantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemQuantityRequest'
      responses:
        '200':
          description: Carrito actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRule'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Carts]
      summary: Retirar artículo del carrito
      description: Retira una línea del carrito.
      operationId: removeCartItem
      responses:
        '200':
          description: Carrito actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRule'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/orders/checkout:
    post:
      tags: [Orders]
      summary: Ejecutar checkout
      description: Descuenta stock, crea un pedido PENDING y vacía el carrito en una transacción.
      operationId: checkoutOrder
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              default:
                $ref: '#/components/examples/CheckoutRequestExample'
      responses:
        '200':
          description: Pedido creado en estado PENDING.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                default:
                  $ref: '#/components/examples/OrderResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRule'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/orders:
    get:
      tags: [Orders]
      summary: Listar pedidos del usuario
      description: Devuelve los pedidos del usuario ordenados por id descendente.
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de pedidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: Consultar pedido
      description: Devuelve un pedido perteneciente al usuario.
      operationId: getOrder
      responses:
        '200':
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                default:
                  $ref: '#/components/examples/OrderResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancelar pedido
      description: Cancela pedidos PENDING o CONFIRMED y repone el stock una sola vez.
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRule'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/orders/{orderId}/confirm:
    post:
      tags: [Orders]
      summary: Confirmar pedido
      description: Avanza un pedido PENDING con detalles a CONFIRMED.
      operationId: confirmOrder
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido confirmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRule'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/orders/{orderId}/preparing:
    post:
      tags: [Orders]
      summary: Pasar pedido a preparación
      description: Avanza únicamente CONFIRMED a PREPARING.
      operationId: prepareOrder
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido en preparación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRule'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/orders/{orderId}/ship:
    post:
      tags: [Orders]
      summary: Enviar pedido
      description: Avanza únicamente PREPARING a SHIPPED.
      operationId: shipOrder
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido enviado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRule'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/orders/{orderId}/deliver:
    post:
      tags: [Orders]
      summary: Entregar pedido
      description: Avanza únicamente SHIPPED a DELIVERED.
      operationId: deliverOrder
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido entregado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRule'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/orders/{orderId}/payment/paid:
    post:
      tags: [Orders]
      summary: Marcar pago como pagado
      description: Avanza el pago desde PENDING o FAILED a PAID.
      operationId: markPaymentPaid
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pago marcado como PAID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRule'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/orders/{orderId}/payment/failed:
    post:
      tags: [Orders]
      summary: Marcar pago como fallido
      description: Avanza el pago únicamente desde PENDING a FAILED.
      operationId: markPaymentFailed
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pago marcado como FAILED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRule'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/{userId}/orders/{orderId}/payment/refund:
    post:
      tags: [Orders]
      summary: Reembolsar pago
      description: Avanza el pago únicamente desde PAID a REFUNDED.
      operationId: refundPayment
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pago marcado como REFUNDED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessRule'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador positivo de 64 bits.
      schema:
        type: integer
        format: int64
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      description: Identificador positivo del usuario.
      schema:
        type: integer
        format: int64
        minimum: 1
    ProductId:
      name: productId
      in: path
      required: true
      description: Identificador positivo del producto.
      schema:
        type: integer
        format: int64
        minimum: 1
    OrderId:
      name: orderId
      in: path
      required: true
      description: Identificador positivo del pedido.
      schema:
        type: integer
        format: int64
        minimum: 1
    Sku:
      name: sku
      in: path
      required: true
      description: SKU textual del producto.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Página basada en cero.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Cantidad positiva de elementos por página.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 20
    ActiveOnly:
      name: activeOnly
      in: query
      required: false
      description: Cuando es true, devuelve únicamente recursos activos. Ausente o false conserva el listado completo.
      schema:
        type: boolean
        default: false
  responses:
    BadRequest:
      description: Solicitud inválida; puede ser VALIDATION_ERROR o MALFORMED_REQUEST.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              $ref: '#/components/examples/ValidationErrorExample'
            malformed:
              $ref: '#/components/examples/MalformedErrorExample'
    NotFound:
      description: Recurso inexistente (RESOURCE_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/NotFoundErrorExample'
    Conflict:
      description: Conflicto de duplicidad, regla de negocio o integridad (409).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            duplicate:
              $ref: '#/components/examples/DuplicateErrorExample'
            business:
              $ref: '#/components/examples/BusinessErrorExample'
    BusinessRule:
      description: Regla de negocio no permitida (BUSINESS_RULE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/BusinessErrorExample'
    InternalError:
      description: Error inesperado sin detalles internos (INTERNAL_ERROR).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/InternalErrorExample'
  schemas:
    RegisterUserRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          maxLength: 80
          minLength: 1
        lastName:
          type: string
          maxLength: 80
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 150
          minLength: 1
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
        description:
          type: string
          maxLength: 500
          nullable: true
    UpdateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
        description:
          type: string
          maxLength: 500
          nullable: true
    CreateProductRequest:
      type: object
      required: [categoryId, sku, name, price, stock]
      properties:
        categoryId:
          type: integer
          format: int64
          minimum: 1
        sku:
          type: string
          maxLength: 50
          minLength: 1
        name:
          type: string
          maxLength: 150
          minLength: 1
        description:
          type: string
          nullable: true
        price:
          $ref: '#/components/schemas/PositiveMoney'
        stock:
          type: integer
          format: int32
          minimum: 0
        imageUrl:
          type: string
          maxLength: 500
          nullable: true
    UpdateProductRequest:
      type: object
      required: [categoryId, sku, name, price]
      properties:
        categoryId:
          type: integer
          format: int64
          minimum: 1
        sku:
          type: string
          maxLength: 50
          minLength: 1
        name:
          type: string
          maxLength: 150
          minLength: 1
        description:
          type: string
          nullable: true
        price:
          $ref: '#/components/schemas/PositiveMoney'
        imageUrl:
          type: string
          maxLength: 500
          nullable: true
    StockAdjustmentRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
    AddCartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
    UpdateCartItemQuantityRequest:
      type: object
      required: [quantity]
      properties:
