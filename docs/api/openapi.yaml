          $ref: '#/components/schemas/NonNegativeMoney'
        recipientName:
          type: string
          maxLength: 160
          minLength: 1
        recipientPhone:
          type: string
          maxLength: 30
          minLength: 1
        shippingAddress:
          type: string
          maxLength: 255
          minLength: 1
        shippingCity:
          type: string
          maxLength: 100
          minLength: 1
        shippingReference:
          type: string
          maxLength: 255
          nullable: true
    UserResponse:
      type: object
      required: [id, firstName, lastName, email, role, active, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CategoryResponse:
