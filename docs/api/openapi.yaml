      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductResponse:
      type: object
      required: [id, categoryId, categoryName, sku, name, price, stock, active, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        sku:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          $ref: '#/components/schemas/PositiveMoney'
        stock:
          type: integer
          format: int32
          minimum: 0
        imageUrl:
          type: string
          nullable: true
        active:
          type: boolean
